purpose_match:
  client: "Продукт соответствует выбранной цели финансирования."
  staff: "purpose matched"
  hint: "none"
R_BUSINESS_NOT_ACTIVE:
  client: "Не удалось подтвердить, что организация действует. Проверьте данные и попробуйте позже."
  staff: "egrul_status={actual} != active"
  hint: "none"
R_ADDRESS_CHECK:
  client: "Не удалось подтвердить данные организации. Проверьте реквизиты и попробуйте позже."
  staff: "mass_address_flag={actual}, required=false"
  hint: "none"
R_DIRECTOR_CHECK:
  client: "Не удалось подтвердить данные организации. Проверьте реквизиты и попробуйте позже."
  staff: "director_disqualified_flag={actual}, required=false"
  hint: "none"
R_OVERDUE:
  client: "По кредитной истории есть неурегулированная просрочка. Закройте её и подайте заявку снова."
  staff: "max_overdue_days={actual} > {threshold}"
  hint: "none"
R_CLIENT_TYPE:
  client: "Этот продукт недоступен для вашей формы организации. Посмотрите другие варианты."
  staff: "client_type={actual} not in {threshold}"
  hint: "suggest_alternative"
R_CLIENT_TYPE_OOO_ONLY:
  client: "Этот продукт доступен только для обществ с ограниченной ответственностью. Посмотрите другие варианты."
  staff: "client_type={actual} not in [OOO]"
  hint: "suggest_alternative"
R_BUSINESS_AGE:
  client: "Для этого продукта бизнес должен работать дольше. Попробуйте другой продукт или вернитесь позже."
  staff: "business_age_months={actual} < {threshold}"
  hint: "suggest_alternative"
R_OKVED_EXCLUDED:
  client: "Для вашего вида деятельности этот продукт недоступен."
  staff: "okved={actual} начинается с исключённого префикса"
  hint: "none"
R_CREDIT_HISTORY:
  client: "Для этого продукта нужна более длительная положительная кредитная история."
  staff: "credit_history_score={actual} < {threshold}"
  hint: "suggest_alternative"
R_AMOUNT_RANGE:
  client: "Запрошенная сумма не подходит для этого продукта. Мы можем подобрать другой вариант."
  staff: "amount={actual} вне диапазона {threshold}"
  hint: "cap_amount"
R_AMOUNT_TO_REVENUE:
  client: "Запрошенная сумма велика относительно выручки. Мы можем предложить меньшую сумму."
  staff: "amount/annual_revenue={actual:.2f} > {threshold:.2f}"
  hint: "cap_amount"
R_NEED_COLLATERAL_FOR_AMOUNT:
  client: "Для суммы без залога есть ограничение. Можно уменьшить сумму или добавить обеспечение."
  staff: "amount={actual} > {threshold} без залога"
  hint: "add_collateral"
R_TERM_TOO_LONG:
  client: "Для этого продукта срок слишком большой. Мы можем предложить более короткий срок."
  staff: "term_days={actual} > {threshold}"
  hint: "clamp_term"
R_TERM_RANGE:
  client: "Запрошенный срок не подходит для этого продукта. Мы можем предложить другой срок."
  staff: "term_months={actual} вне диапазона {threshold}"
  hint: "clamp_term"
R_COLLATERAL:
  client: "Уточните, есть ли у вас обеспечение по кредиту."
  staff: "has_collateral={actual}"
  hint: "add_collateral"
R_COLLATERAL_REQUIRED:
  client: "Для этого продукта нужно обеспечение. Добавьте залог или выберите продукт без залога."
  staff: "has_collateral={actual}, required=true"
  hint: "add_collateral"
R_DOWN_PAYMENT:
  client: "Увеличьте первоначальный взнос до допустимого уровня."
  staff: "down_payment_pct={actual} < {threshold}"
  hint: "increase_down_payment"
R_NEED_INVOICE:
  client: "Приложите счёт или договор поставщика оборудования."
  staff: "supplier_invoice_attached missing or false"
  hint: "request_documents"
R_NEED_BUSINESS_PLAN:
  client: "Приложите бизнес-план для рассмотрения инвестиционного кредита."
  staff: "business_plan_attached missing or false"
  hint: "request_documents"
R_NEED_TENDER_NUMBER:
  client: "Укажите номер тендера, для которого нужна гарантия."
  staff: "tender_number missing"
  hint: "request_documents"
R_NEED_REVENUE:
  client: "Укажите выручку за последний год или загрузите отчётность, чтобы мы проверили условия."
  staff: "annual_revenue missing"
  hint: "request_documents"
R_NEED_TURNOVER:
  client: "Укажите среднемесячный оборот, чтобы мы проверили условия."
  staff: "avg_monthly_turnover missing"
  hint: "request_documents"
R_PAYMENT_BURDEN:
  client: "Ежемесячный платёж получается слишком высоким для вашего оборота. Попробуйте увеличить срок."
  staff: "payment/turnover={actual:.2f} > {threshold:.2f}"
  hint: "extend_term"
R_DEBT_LOAD:
  client: "Текущие обязательства уже занимают значительную часть оборота. Уменьшение суммы или срока может помочь."
  staff: "DTI={actual:.2f} > {threshold:.2f}"
  hint: "reduce_amount_or_extend_term"
R_NEGATIVE_PROFIT:
  client: "Для этого продукта нужна положительная прибыль по отчётности."
  staff: "net_profit={actual} <= 0"
  hint: "none"
