name: smart-credit-cabinet
services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      DOCUMENT_STORAGE_PATH: /data/documents
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-json_object}
      LLM_REASONING_ENABLED: ${LLM_REASONING_ENABLED:-}
      LLM_DATA_COLLECTION: ${LLM_DATA_COLLECTION:-deny}
      LLM_POLZA_MAX_PROMPT_RUB: ${LLM_POLZA_MAX_PROMPT_RUB:-0}
      LLM_POLZA_MAX_COMPLETION_RUB: ${LLM_POLZA_MAX_COMPLETION_RUB:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000']
    healthcheck:
      test: [CMD, uv, run, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")']
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    environment:
      APP_ADDRESS: ':80'
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ollama]
    volumes:
      - ollama_data:/root/.ollama
volumes:
  caddy_data:
  caddy_config:
  ollama_data:
  postgres_data:
  document_data:
