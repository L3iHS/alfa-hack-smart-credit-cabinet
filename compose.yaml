name: smart-credit-cabinet
services:
  db:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes:
      - document_data:/data/documents
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000']
    healthcheck:
      test: [CMD, uv, run, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health")']
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  document_data:
