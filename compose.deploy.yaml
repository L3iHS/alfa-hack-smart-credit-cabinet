x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    restart: unless-stopped
    logging: *bounded-logs
  backend:
    environment:
      COOKIE_SECURE: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1200}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-json_object}
      LLM_REASONING_ENABLED: ${LLM_REASONING_ENABLED:-}
      LLM_DATA_COLLECTION: ${LLM_DATA_COLLECTION:-deny}
      LLM_POLZA_MAX_PROMPT_RUB: ${LLM_POLZA_MAX_PROMPT_RUB:-0}
      LLM_POLZA_MAX_COMPLETION_RUB: ${LLM_POLZA_MAX_COMPLETION_RUB:-0}
      FORWARDED_ALLOW_IPS: "*"
    restart: unless-stopped
    logging: *bounded-logs
  frontend:
    restart: unless-stopped
    logging: *bounded-logs
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    logging: *bounded-logs

volumes:
  caddy_data:
  caddy_config:
